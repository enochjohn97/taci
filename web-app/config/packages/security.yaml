security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
      algorithm: bcrypt
      cost: 13

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: username

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    
    login:
      pattern: ^/login$
      security: false
    
    role_select:
      pattern: ^/role-select$
      security: false
    
    main:
      lazy: true
      provider: app_user_provider
      custom_authenticator: App\Security\AppAuthenticator
      logout:
        path: app_logout
        target: app_role_select
      remember_me:
        secret: '%kernel.secret%'
        lifetime: 604800
        path: /
        always_remember_me: false

  access_control:
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/role-select, roles: PUBLIC_ACCESS }
    - { path: ^/password-recovery, roles: PUBLIC_ACCESS }
    - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
    - { path: ^/sub-admin, roles: [ROLE_SUPER_ADMIN, ROLE_SUB_ADMIN] }
    - { path: ^/store, roles: [ROLE_SUPER_ADMIN, ROLE_SUB_ADMIN, ROLE_STAFF] }
    - { path: ^/api/, roles: ROLE_SUPER_ADMIN }
    - { path: ^/, roles: ROLE_SUPER_ADMIN }
