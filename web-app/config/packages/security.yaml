security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
      algorithm: bcrypt
      cost: 13

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: username

  role_hierarchy:
    ROLE_SUPER_ADMIN: [ROLE_SUB_ADMIN, ROLE_MANAGER]
    ROLE_SUB_ADMIN:   [ROLE_MANAGER]
    # Managers are not granted ROLE_STAFF by default to prevent unintended access; staff is assigned explicitly

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    role_select:
      pattern: ^/role-select$
      security: false

    main:
      lazy: true
      provider: app_user_provider
      custom_authenticator: App\Security\AppAuthenticator
      # Redirect denied requests to role-aware dashboard instead of raw 403 exception page.
      access_denied_url: /dashboard
      logout:
        path: app_logout
        target: app_logout_success
        delete_cookies:
          - PHPSESSID
      remember_me:
        secret: "%kernel.secret%"
        lifetime: 604800
        path: /
        always_remember_me: false
      switch_user:
        parameter: '_switch_user'
        role: 'ROLE_SUB_ADMIN'

  access_control:
    - { path: ^/login, roles: PUBLIC_ACCESS }
    - { path: ^/role-select, roles: PUBLIC_ACCESS }
    - { path: ^/password-recovery, roles: PUBLIC_ACCESS }
    - { path: ^/password-reset, roles: PUBLIC_ACCESS }
    - { path: ^/admin, roles: ROLE_SUPER_ADMIN }
    - { path: ^/settings/admin, roles: ROLE_SUPER_ADMIN }
    - { path: ^/settings/profile, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/, roles: [ROLE_SUPER_ADMIN, ROLE_SUB_ADMIN] }
    - { path: ^/loyalty/api/, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/engagement/api/, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/fuel, roles: [ROLE_SUPER_ADMIN, ROLE_SUB_ADMIN] }
    - { path: ^/engagement/promotions, roles: ROLE_SUPER_ADMIN }
    - { path: ^/engagement/reports, roles: ROLE_SUPER_ADMIN }
    - { path: ^/engagement/wallet, roles: [ROLE_SUPER_ADMIN, ROLE_SUB_ADMIN, ROLE_MANAGER, ROLE_STAFF] }
    - { path: ^/engagement, roles: [ROLE_SUPER_ADMIN, ROLE_MANAGER] }
    - { path: ^/tracking, roles: [ROLE_SUPER_ADMIN, ROLE_SUB_ADMIN] }
    - { path: ^/reports, roles: [ROLE_SUPER_ADMIN, ROLE_SUB_ADMIN] }
    - { path: ^/dashboard/super-admin, roles: ROLE_SUPER_ADMIN }
    - { path: ^/dashboard/sub-admin, roles: ROLE_SUB_ADMIN }
    - { path: ^/dashboard/manager, roles: ROLE_MANAGER }
    - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
