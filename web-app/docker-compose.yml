version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: taci_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taci_petroleum_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taci_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: taci_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taci_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mercure Server (Real-time Notifications)
  mercure:
    image: dunglas/mercure:v0.6
    container_name: taci_mercure
    environment:
      MERCURE_PUBLISHER_JWT_KEY: "!ChangeMe!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeMe!"
      MERCURE_ALLOW_ANONYMOUS: "1"
    ports:
      - "3000:80"
    networks:
      - taci_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/.well-known/mercure"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailhog (Email Testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: taci_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - taci_network

  # Symfony Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taci_app
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/taci_petroleum_db?serverVersion=14&charset=utf8"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MERCURE_URL: "http://mercure"
      MAILER_DSN: "smtp://mailhog:1025"
    ports:
      - "9000:9000"
    volumes:
      - .:/app
      - /app/var
    working_dir: /app
    networks:
      - taci_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mercure:
        condition: service_healthy
    command: >
      bash -c "
        composer install &&
        php bin/console doctrine:migrations:migrate --no-interaction &&
        php bin/console doctrine:fixtures:load --no-interaction &&
        php-fpm
      "

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: taci_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - taci_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  taci_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
